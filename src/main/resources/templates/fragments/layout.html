<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Sidebar -->
<div th:fragment="sidebar(activeMenu)">
    <aside id="sidebar"
           class="fixed z-30 top-0 left-0 h-screen w-72 bg-gradient-to-b from-green-800 via-green-700 to-emerald-600 text-white shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out">

        <div class="relative px-6 py-5 border-b border-white/20">
            <div>
                <h2 class="text-2xl font-extrabold">NEXUS APP</h2>
                <p class="text-sm text-green-100">Panel de gestión</p>
            </div>

            <button id="closeSidebar"
                    class="absolute top-4 right-4 text-white text-2xl hover:scale-110 transition">
                ✕
            </button>
        </div>

        <nav class="p-4 space-y-2">
            <a th:href="@{/}"
               th:class="${activeMenu == 'inicio'}
                   ? 'flex items-center gap-3 rounded-2xl px-4 py-3 bg-white text-green-700 shadow-md font-bold'
                   : 'flex items-center gap-3 rounded-2xl px-4 py-3 hover:bg-white/20 transition font-medium'">
                <span>🏠</span>
                <span>Inicio</span>
            </a>

            <a th:href="@{/view/usuarios}"
               th:class="${activeMenu == 'usuarios'}
                   ? 'flex items-center gap-3 rounded-2xl px-4 py-3 bg-white text-green-700 shadow-md font-bold'
                   : 'flex items-center gap-3 rounded-2xl px-4 py-3 hover:bg-white/20 transition font-medium'">
                <span>👥</span>
                <span>Usuarios</span>
            </a>

            <a th:href="@{/view/usuarios/form}"
               th:class="${activeMenu == 'registrar'}
                   ? 'flex items-center gap-3 rounded-2xl px-4 py-3 bg-white text-green-700 shadow-md font-bold'
                   : 'flex items-center gap-3 rounded-2xl px-4 py-3 hover:bg-white/20 transition font-medium'">
                <span>➕</span>
                <span>Registrar</span>
            </a>

            <a th:href="@{/view/usuarios/pdf}"
               class="flex items-center gap-3 rounded-2xl px-4 py-3 hover:bg-white/20 transition font-medium">
                <span>📄</span>
                <span>Exportar PDF</span>
            </a>

            <a th:href="@{/view/usuarios/excel}"
               class="flex items-center gap-3 rounded-2xl px-4 py-3 hover:bg-white/20 transition font-medium">
                <span>📊</span>
                <span>Exportar Excel</span>
            </a>
        </nav>

        <div class="absolute bottom-0 w-full p-4 border-t border-white/20">
            <div class="rounded-2xl bg-white/10 p-4 text-sm text-green-50">
                Sistema de gestión de usuarios con estilo institucional moderno.
            </div>
        </div>
    </aside>
</div>

<!-- Topbar -->
<div th:fragment="topbar(title)">
    <header class="sticky top-0 z-10 bg-white/80 backdrop-blur-md border-b border-green-100 shadow-sm">
        <div class="flex items-center justify-between px-4 md:px-8 py-4">
            <div class="flex items-center gap-4">
                <button id="openSidebar"
                        class="rounded-xl bg-green-700 text-white px-3 py-2 shadow hover:bg-green-800 transition">
                    ☰
                </button>

                <div>
                    <h1 class="text-2xl font-extrabold text-green-700" th:text="${title}"></h1>
                    <p class="text-sm text-gray-500">Panel administrativo</p>
                </div>
            </div>

            <div class="hidden sm:flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-green-700 to-emerald-500 flex items-center justify-center text-white font-bold shadow-lg">
                    S
                </div>
            </div>
        </div>
    </header>
</div>

</html>
