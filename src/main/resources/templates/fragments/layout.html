<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Sidebar -->
<div th:fragment="sidebar(activeMenu)">
    <aside id="sidebar"
           class="fixed z-30 top-0 left-0 h-screen w-72 bg-gradient-to-b from-green-800 via-green-700 to-emerald-600 text-white shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out">

        <div class="relative px-6 py-5 border-b border-white/20">
            <div>
                <h2 class="text-2xl font-extrabold">NEXUS APP</h2>
                <p class="text-sm text-green-100">Panel de gestión</p>
            </div>
            <button id="closeSidebar" class="absolute top-4 right-4 text-white text-2xl hover:scale-110 transition">✕</button>
        </div>

        <nav class="p-4 space-y-1 overflow-y-auto max-h-[calc(100vh-180px)]">

            <a th:href="@{/dashboard}"
               th:class="${activeMenu == 'inicio'}
                   ? 'flex items-center gap-3 rounded-2xl px-4 py-3 bg-white text-green-700 shadow-md font-bold'
                   : 'flex items-center gap-3 rounded-2xl px-4 py-3 hover:bg-white/20 transition font-medium'">
                <span>🏠</span><span>Dashboard</span>
            </a>

            <!-- Solo Administrador -->
            <div sec:authorize="hasRole('ADMINISTRADOR')">
                <a th:href="@{/view/usuarios}"
                   th:class="${activeMenu == 'usuarios'}
                       ? 'flex items-center gap-3 rounded-2xl px-4 py-3 bg-white text-green-700 shadow-md font-bold'
                       : 'flex items-center gap-3 rounded-2xl px-4 py-3 hover:bg-white/20 transition font-medium'">
                    <span>👥</span><span>Usuarios</span>
                </a>

                <a th:href="@{/view/agentes}"
                   th:class="${activeMenu == 'agentes'}
                       ? 'flex items-center gap-3 rounded-2xl px-4 py-3 bg-white text-green-700 shadow-md font-bold'
                       : 'flex items-center gap-3 rounded-2xl px-4 py-3 hover:bg-white/20 transition font-medium'">
                    <span>🕵️</span><span>Agentes</span>
                </a>

                <a th:href="@{/view/rol}"
                   th:class="${activeMenu == 'rol'}
                       ? 'flex items-center gap-3 rounded-2xl px-4 py-3 bg-white text-green-700 shadow-md font-bold'
                       : 'flex items-center gap-3 rounded-2xl px-4 py-3 hover:bg-white/20 transition font-medium'">
                    <span>🛡️</span><span>Roles</span>
                </a>

                <a th:href="@{/view/personal}"
                   th:class="${activeMenu == 'personal'}
                       ? 'flex items-center gap-3 rounded-2xl px-4 py-3 bg-white text-green-700 shadow-md font-bold'
                       : 'flex items-center gap-3 rounded-2xl px-4 py-3 hover:bg-white/20 transition font-medium'">
                    <span>👨‍💼</span><span>Personal</span>
                </a>
            </div>

            <!-- Ambos roles -->
            <a th:href="@{/view/personalExterno}"
               th:class="${activeMenu == 'personalExterno'}
                   ? 'flex items-center gap-3 rounded-2xl px-4 py-3 bg-white text-green-700 shadow-md font-bold'
                   : 'flex items-center gap-3 rounded-2xl px-4 py-3 hover:bg-white/20 transition font-medium'">
                <span>👤</span><span>Personal Externo</span>
            </a>

            <a th:href="@{/view/ambientes}"
               th:class="${activeMenu == 'ambientes'}
                   ? 'flex items-center gap-3 rounded-2xl px-4 py-3 bg-white text-green-700 shadow-md font-bold'
                   : 'flex items-center gap-3 rounded-2xl px-4 py-3 hover:bg-white/20 transition font-medium'">
                <span>🏫</span><span>Ambientes</span>
            </a>

            <a th:href="@{/view/llaves}"
               th:class="${activeMenu == 'llaves'}
                   ? 'flex items-center gap-3 rounded-2xl px-4 py-3 bg-white text-green-700 shadow-md font-bold'
                   : 'flex items-center gap-3 rounded-2xl px-4 py-3 hover:bg-white/20 transition font-medium'">
                <span>🔑</span><span>Llaves</span>
            </a>

            <a th:href="@{/view/prestamoAmbientes}"
               th:class="${activeMenu == 'prestamoAmbientes'}
                   ? 'flex items-center gap-3 rounded-2xl px-4 py-3 bg-white text-green-700 shadow-md font-bold'
                   : 'flex items-center gap-3 rounded-2xl px-4 py-3 hover:bg-white/20 transition font-medium'">
                <span>📋</span><span>Préstamo Ambientes</span>
            </a>

        </nav>

        <!-- Usuario + Logout -->
        <div class="absolute bottom-0 w-full p-4 border-t border-white/20">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-white font-bold text-lg">
                    <span sec:authentication="name" class="uppercase" th:text="${#strings.substring(#authentication.name, 0, 1)}">U</span>
                </div>
                <div>
                    <p class="text-sm font-bold text-white" sec:authentication="name">Usuario</p>
                    <p class="text-xs text-green-200" sec:authorize="hasRole('ADMINISTRADOR')">Administrador</p>
                    <p class="text-xs text-green-200" sec:authorize="hasRole('VIGILANTE')">Vigilante</p>
                </div>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit"
                        class="w-full rounded-2xl bg-white/10 hover:bg-white/25 transition px-4 py-2 text-sm font-semibold text-white flex items-center justify-center gap-2">
                    🚪 Cerrar Sesión
                </button>
            </form>
        </div>
    </aside>
</div>

<!-- Topbar -->
<div th:fragment="topbar(title)">
    <header class="sticky top-0 z-10 bg-white/80 backdrop-blur-md border-b border-green-100 shadow-sm">
        <div class="flex items-center justify-between px-4 md:px-8 py-4">
            <div class="flex items-center gap-4">
                <button id="openSidebar"
                        class="rounded-xl bg-green-700 text-white px-3 py-2 shadow hover:bg-green-800 transition">☰</button>
                <div>
                    <h1 class="text-2xl font-extrabold text-green-700" th:text="${title}"></h1>
                    <p class="text-sm text-gray-500">Panel administrativo · NEXUS APP</p>
                </div>
            </div>
            <div class="hidden sm:flex items-center gap-3">
                <div class="text-right">
                    <p class="text-sm font-semibold text-gray-700" sec:authentication="name">Usuario</p>
                    <p class="text-xs text-gray-400" sec:authorize="hasRole('ADMINISTRADOR')">Administrador</p>
                    <p class="text-xs text-gray-400" sec:authorize="hasRole('VIGILANTE')">Vigilante</p>
                </div>
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-green-700 to-emerald-500 flex items-center justify-center text-white font-bold shadow-lg">
                    <span sec:authentication="name" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
                </div>
            </div>
        </div>
    </header>
</div>

</html>
