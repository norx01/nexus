<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Préstamo de Ambientes - NEXUS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-green-50 via-white to-emerald-100 text-gray-800">
<div class="flex min-h-screen">
    <div th:replace="fragments/layout :: sidebar('prestamoAmbientes')"></div>
    <div id="overlay" class="fixed inset-0 bg-black/40 z-20 hidden"></div>
    <div class="flex-1">
        <div th:replace="fragments/layout :: topbar('Préstamo de Ambientes')"></div>

        <main class="p-4 md:p-8">

            <div th:if="${success}" class="mb-5 rounded-2xl border border-green-200 bg-green-50 px-5 py-4 text-green-800 shadow-sm font-semibold" th:text="${success}"></div>

            <!-- Acciones -->
            <div class="flex flex-wrap gap-3 mb-8">
                <a th:href="@{/autoservicio}"
                   class="rounded-2xl bg-gradient-to-r from-green-700 to-emerald-500 px-5 py-3 text-white font-bold shadow-lg hover:scale-[1.02] transition flex items-center gap-2">
                    🔑 Nuevo Préstamo (Autoservicio)
                </a>
                <a th:href="@{/view/prestamoAmbientes/pdf}"
                   class="rounded-2xl bg-gradient-to-r from-red-600 to-rose-500 px-5 py-3 text-white font-bold shadow-lg hover:scale-[1.02] transition">
                    📄 Exportar PDF
                </a>
                <a th:href="@{/view/prestamoAmbientes/excel}"
                   class="rounded-2xl bg-gradient-to-r from-emerald-600 to-green-500 px-5 py-3 text-white font-bold shadow-lg hover:scale-[1.02] transition">
                    📊 Exportar Excel
                </a>
            </div>

            <!-- ====== PRÉSTAMOS ACTIVOS ====== -->
            <div class="mb-8">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-3 h-3 rounded-full bg-orange-500 animate-pulse"></div>
                    <h2 class="text-xl font-bold text-orange-700">Préstamos en curso</h2>
                    <span class="bg-orange-100 text-orange-700 text-sm font-bold px-3 py-1 rounded-xl"
                          th:text="${#lists.size(activos)}">0</span>
                </div>

                <div th:if="${#lists.isEmpty(activos)}"
                     class="bg-white/70 rounded-2xl p-8 text-center text-gray-500 border border-orange-100">
                    <span class="text-4xl">🏫</span>
                    <p class="mt-2">No hay préstamos activos en este momento.</p>
                </div>

                <div th:if="${!#lists.isEmpty(activos)}"
                     class="bg-white/85 backdrop-blur-md border border-orange-200 rounded-3xl shadow-xl overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full">
                            <thead>
                            <tr class="bg-orange-600 text-white text-sm uppercase tracking-wide">
                                <th class="px-5 py-4 text-left">Instructor</th>
                                <th class="px-5 py-4 text-left">Ambiente</th>
                                <th class="px-5 py-4 text-left">Fecha</th>
                                <th class="px-5 py-4 text-left">Hora Entrada</th>
                                <th class="px-5 py-4 text-center">Estado</th>
                            </tr>
                            </thead>
                            <tbody class="divide-y divide-orange-100">
                            <tr th:each="p : ${activos}" class="hover:bg-orange-50/70 transition">
                                <td class="px-5 py-4 font-bold text-gray-800"
                                    th:text="${personalMap[p.id_personal]} ?: 'ID: ' + ${p.id_personal}"></td>
                                <td class="px-5 py-4 text-gray-700"
                                    th:text="${ambientesMap[p.id_ambiente]} ?: 'ID: ' + ${p.id_ambiente}"></td>
                                <td class="px-5 py-4 text-gray-600" th:text="${p.fecha}"></td>
                                <td class="px-5 py-4 font-mono text-orange-700 font-bold" th:text="${p.hora_entrada}"></td>
                                <td class="px-5 py-4 text-center">
                                    <span class="bg-orange-100 text-orange-700 px-3 py-1 rounded-xl text-xs font-bold">⚡ Activo</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- ====== HISTORIAL ====== -->
            <div>
                <div class="flex items-center gap-3 mb-4">
                    <h2 class="text-xl font-bold text-gray-600">📋 Historial de préstamos</h2>
                    <span class="bg-gray-100 text-gray-600 text-sm font-bold px-3 py-1 rounded-xl"
                          th:text="${#lists.size(historial)}">0</span>
                </div>

                <div class="bg-white/85 backdrop-blur-md border border-green-100 rounded-3xl shadow-2xl overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full">
                            <thead>
                            <tr class="bg-green-100 text-green-900 text-xs uppercase tracking-wide">
                                <th class="px-5 py-4 text-center">⚙️</th>
                                <th class="px-5 py-4 text-left">Instructor</th>
                                <th class="px-5 py-4 text-left">Ambiente</th>
                                <th class="px-5 py-4 text-left">Fecha</th>
                                <th class="px-5 py-4 text-left">Entrada</th>
                                <th class="px-5 py-4 text-left">Salida</th>
                                <th class="px-5 py-4 text-left">Estado</th>
                            </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                            <tr th:each="p : ${historial}" class="hover:bg-green-50/50 transition text-sm">
                                <td class="px-5 py-3 text-center">
                                    <form th:action="@{'/view/prestamoAmbientes/delete/' + ${p.id_prestamo}}" method="post">
                                        <button type="submit" onclick="return confirm('¿Eliminar este registro?')"
                                                class="w-9 h-9 rounded-xl bg-red-500 text-white flex items-center justify-center mx-auto hover:bg-red-600 transition text-sm">🗑️</button>
                                    </form>
                                </td>
                                <td class="px-5 py-3 font-semibold text-gray-800"
                                    th:text="${personalMap[p.id_personal]} ?: 'ID: ' + ${p.id_personal}"></td>
                                <td class="px-5 py-3 text-gray-700"
                                    th:text="${ambientesMap[p.id_ambiente]} ?: 'ID: ' + ${p.id_ambiente}"></td>
                                <td class="px-5 py-3 text-gray-600" th:text="${p.fecha}"></td>
                                <td class="px-5 py-3 font-mono text-gray-700" th:text="${p.hora_entrada}"></td>
                                <td class="px-5 py-3 font-mono text-gray-700" th:text="${p.hora_salida ?: '—'}"></td>
                                <td class="px-5 py-3">
                                    <span th:text="${p.estado ?: 'Finalizado'}"
                                          class="bg-gray-100 text-gray-600 px-2 py-1 rounded-xl text-xs font-semibold"></span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(historial)}">
                                <td colspan="7" class="px-5 py-10 text-center text-gray-400">No hay historial de préstamos.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>
<script th:src="@{/js/script.js}" defer></script>
</body>
</html>
