<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Ambiente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-green-50 via-white to-emerald-100 text-gray-800">
<div class="flex min-h-screen">
    <div th:replace="fragments/layout :: sidebar('ambientes')"></div>
    <div id="overlay" class="fixed inset-0 bg-black/40 z-20 hidden"></div>
    <div class="flex-1">
        <div th:replace="fragments/layout :: topbar('Formulario Ambiente')"></div>
        <main class="p-4 md:p-8 flex items-center justify-center">
            <div class="w-full max-w-2xl">
                <div class="text-center mb-8">
                    <div class="mx-auto w-20 h-20 rounded-full bg-gradient-to-br from-green-600 to-emerald-500 flex items-center justify-center shadow-lg shadow-green-200">
                        <span class="text-white text-3xl font-bold">A</span>
                    </div>
                    <h2 class="mt-4 text-3xl md:text-4xl font-extrabold text-green-700"
                        th:text="${ambiente.id_ambiente == null} ? 'Registrar Ambiente' : 'Editar Ambiente'"></h2>
                </div>
                <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl border border-green-100 overflow-hidden">
                    <div class="bg-gradient-to-r from-green-700 via-green-600 to-emerald-500 px-8 py-6">
                        <h2 class="text-white text-xl font-bold">Formulario de Ambiente</h2>
                        <p class="text-green-50 text-sm mt-1">Complete la información solicitada para guardar el registro</p>
                    </div>
                    <div class="p-8 md:p-10">
                        <form th:action="@{/view/ambientes/save}" th:object="${ambiente}" method="post" novalidate class="space-y-6">
                            <input type="hidden" th:field="*{id_ambiente}" />
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-2">Nombre</label>
                                    <input type="text" th:field="*{nombre}" required placeholder="Ingrese el nombre"
                                           class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-gray-800 shadow-sm transition duration-300 focus:border-green-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-green-100" />
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-2">Sede</label>
                                    <input type="text" th:field="*{sede}" required placeholder="Ingrese la sede"
                                           class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-gray-800 shadow-sm transition duration-300 focus:border-green-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-green-100" />
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-2">Estado</label>
                                    <select th:field="*{estado}" required
                                            class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-gray-800 shadow-sm transition duration-300 focus:border-green-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-green-100">
                                        <option value="" disabled selected>Seleccione una opción</option>
                                        <option value="Disponible">Disponible</option>
                                        <option value="Ocupado">Ocupado</option>
                                        <option value="Mantenimiento">Mantenimiento</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-2">Observaciones</label>
                                    <textarea th:field="*{observaciones}" rows="3" placeholder="Observaciones adicionales"
                                              class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-gray-800 shadow-sm transition duration-300 focus:border-green-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-green-100 resize-none"></textarea>
                                </div>
                            </div>
                            <div class="flex flex-col sm:flex-row gap-4 pt-4">
                                <button type="submit"
                                        class="flex-1 rounded-2xl bg-gradient-to-r from-green-700 to-emerald-500 px-6 py-3 text-white font-bold shadow-lg shadow-green-200 transition duration-300 hover:scale-[1.02] hover:shadow-xl">
                                    Guardar Ambiente
                                </button>
                                <a th:href="@{/view/ambientes}"
                                   class="flex-1 rounded-2xl border border-gray-200 bg-white px-6 py-3 text-center text-gray-700 font-semibold shadow-sm transition duration-300 hover:bg-gray-50 hover:shadow-md">
                                    Volver
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/script.js}" defer></script>
</body>
</html>
