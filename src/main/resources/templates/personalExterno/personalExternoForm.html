<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Visita - NEXUS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-green-50 via-white to-emerald-100 text-gray-800">
<div class="flex min-h-screen">
    <div th:replace="fragments/layout :: sidebar('personalExterno')"></div>
    <div id="overlay" class="fixed inset-0 bg-black/40 z-20 hidden"></div>

    <div class="flex-1">
        <div th:replace="fragments/layout :: topbar('Registrar Visita Externa')"></div>

        <main class="p-4 md:p-8">
            <div class="max-w-2xl mx-auto">

                <div class="text-center mb-8">
                    <div class="mx-auto w-20 h-20 rounded-full bg-gradient-to-br from-green-600 to-emerald-500 flex items-center justify-center shadow-lg shadow-green-200">
                        <span class="text-4xl">👤</span>
                    </div>
                    <h2 class="mt-4 text-3xl font-extrabold text-green-700"
                        th:text="${personalExterno.id_personal_externo == null} ? 'Registrar Ingreso' : 'Editar Visita'"></h2>
                    <p class="mt-1 text-gray-500">Complete los datos del visitante externo</p>
                </div>

                <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl border border-green-100 overflow-hidden">
                    <div class="bg-gradient-to-r from-green-700 to-emerald-500 px-8 py-5">
                        <h3 class="text-white text-lg font-bold">Datos del Visitante</h3>
                        <p class="text-green-100 text-sm mt-0.5">La fecha y hora de ingreso se registran automáticamente</p>
                    </div>

                    <div class="p-8">
                        <form th:action="@{/view/personalExterno/save}" th:object="${personalExterno}" method="post" class="space-y-5">
                            <input type="hidden" th:field="*{id_personal_externo}" />
                            <input type="hidden" th:field="*{fecha_creacion}" />
                            <input type="hidden" th:field="*{estado}" />
                            <input type="hidden" th:field="*{hora_salida}" />
                            <input type="hidden" th:field="*{tiempo_estancia}" />

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                                <div class="md:col-span-2">
                                    <label class="block text-sm font-bold text-gray-700 mb-1.5">Nombre completo *</label>
                                    <input type="text" th:field="*{nombre}" required autofocus
                                           placeholder="Nombres y apellidos"
                                           class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-gray-800 focus:border-green-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-green-100 transition" />
                                </div>

                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1.5">Tipo de Documento *</label>
                                    <select th:field="*{tipo_documento}" required
                                            class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-gray-800 focus:border-green-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-green-100 transition">
                                        <option value="">Seleccione...</option>
                                        <option value="CC">Cédula de Ciudadanía</option>
                                        <option value="TI">Tarjeta de Identidad</option>
                                        <option value="CE">Cédula de Extranjería</option>
                                        <option value="PA">Pasaporte</option>
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1.5">Número de Documento *</label>
                                    <input type="text" th:field="*{documento}" required
                                           placeholder="Número de documento"
                                           class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-gray-800 font-mono focus:border-green-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-green-100 transition" />
                                </div>

                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1.5">Teléfono</label>
                                    <input type="text" th:field="*{telefono}"
                                           placeholder="Número de teléfono"
                                           class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-gray-800 focus:border-green-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-green-100 transition" />
                                </div>

                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1.5">Empresa / Institución</label>
                                    <input type="text" th:field="*{empresa}"
                                           placeholder="Empresa u organización"
                                           class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-gray-800 focus:border-green-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-green-100 transition" />
                                </div>

                                <div class="md:col-span-2">
                                    <label class="block text-sm font-bold text-gray-700 mb-1.5">Motivo de la Visita *</label>
                                    <textarea th:field="*{motivo_visita}" required rows="3"
                                              placeholder="Describa el motivo de la visita..."
                                              class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-gray-800 focus:border-green-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-green-100 transition resize-none"></textarea>
                                </div>

                                <!-- Fecha y hora de visita -->
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1.5">Fecha de Visita *</label>
                                    <input type="date" th:field="*{fecha_visita}" required
                                           class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-gray-800 focus:border-green-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-green-100 transition" />
                                </div>

                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1.5">Hora de Ingreso *</label>
                                    <input type="time" th:field="*{hora_ingreso}" required
                                           class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-gray-800 font-mono focus:border-green-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-green-100 transition" />
                                </div>

                            </div>

                            <div class="flex gap-3 pt-2">
                                <button type="submit"
                                        class="flex-1 rounded-2xl bg-gradient-to-r from-green-700 to-emerald-500 py-3 text-white font-bold shadow-lg transition hover:scale-[1.01] hover:shadow-xl">
                                    ✅ Registrar Ingreso
                                </button>
                                <a th:href="@{/view/personalExterno}"
                                   class="flex-1 rounded-2xl border border-gray-200 bg-white py-3 text-center text-gray-700 font-semibold hover:bg-gray-50 transition">
                                    ← Volver
                                </a>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/script.js}" defer></script>
</body>
</html>
