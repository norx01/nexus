<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Personal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-green-50 via-white to-emerald-100 text-gray-800">
<div class="flex min-h-screen">
    <div th:replace="fragments/layout :: sidebar('personal')"></div>
    <div id="overlay" class="fixed inset-0 bg-black/40 z-20 hidden"></div>
    <div class="flex-1">
        <div th:replace="fragments/layout :: topbar('Gestión de Personal')"></div>
        <main class="p-4 md:p-8">
            <div th:if="${success}" class="mb-6">
                <div class="rounded-2xl border border-green-200 bg-green-50 px-5 py-4 text-green-800 shadow-sm" th:text="${success}"></div>
            </div>
            <div class="flex flex-wrap gap-4 mb-8">
                <a th:href="@{/view/personal/form}" class="rounded-2xl bg-gradient-to-r from-green-700 to-emerald-500 px-5 py-3 text-white font-bold shadow-lg hover:scale-[1.02] transition">
                    📝 Registrar Personal
                </a>
                <a th:href="@{/view/personal/pdf}" class="rounded-2xl bg-gradient-to-r from-red-600 to-rose-500 px-5 py-3 text-white font-bold shadow-lg hover:scale-[1.02] transition">
                    📄 Exportar PDF
                </a>
                <a th:href="@{/view/personal/excel}" class="rounded-2xl bg-gradient-to-r from-emerald-600 to-green-500 px-5 py-3 text-white font-bold shadow-lg hover:scale-[1.02] transition">
                    📊 Exportar Excel
                </a>
            </div>
            <div class="bg-white/85 backdrop-blur-md border border-green-100 rounded-3xl shadow-2xl overflow-hidden">
                <div class="px-6 py-5 border-b border-green-100 bg-gradient-to-r from-white to-green-50">
                    <h2 class="text-xl md:text-2xl font-bold text-green-700">Lista de Personal Registrado</h2>
                    <p class="text-sm text-gray-500 mt-1">Consulta y administra los registros del sistema</p>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full">
                        <thead>
                        <tr class="bg-green-100 text-green-900 text-sm uppercase tracking-wide">
                            <th class="px-6 py-4 text-center font-bold">⚙️</th>
                            <th class="px-6 py-4 text-left font-bold">ID</th>
                            <th class="px-6 py-4 text-left font-bold">Nombre</th>
                            <th class="px-6 py-4 text-left font-bold">Documento</th>
                            <th class="px-6 py-4 text-left font-bold">Teléfono</th>
                            <th class="px-6 py-4 text-left font-bold">Correo</th>
                            <th class="px-6 py-4 text-left font-bold">Dirección</th>
                            <th class="px-6 py-4 text-left font-bold">Rol</th>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                        <tr th:each="p : ${personal}" class="hover:bg-green-50/70 transition duration-200">
                            <td class="px-6 py-4 text-center">
                                <div class="flex items-center justify-center gap-2">
                                    <a th:href="@{'/view/personal/edit/' + ${p.id_personal}}"
                                       class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-amber-400 text-white shadow-md hover:bg-amber-500 hover:scale-105 transition">✏️</a>
                                    <form th:action="@{'/view/personal/delete/' + ${p.id_personal}}" method="post" class="inline">
                                        <button type="submit"
                                                class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-red-500 text-white shadow-md hover:bg-red-600 hover:scale-105 transition"
                                                onclick="return confirm('¿Está seguro que desea eliminar este personal?')">🗑️</button>
                                    </form>
                                </div>
                            </td>
                            <td class="px-6 py-4 font-medium text-gray-700" th:text="${p.id_personal}"></td>
                            <td class="px-6 py-4 text-gray-700" th:text="${p.nombre}"></td>
                            <td class="px-6 py-4 text-gray-700" th:text="${p.documento}"></td>
                            <td class="px-6 py-4 text-gray-700" th:text="${p.telefono}"></td>
                            <td class="px-6 py-4 text-gray-700" th:text="${p.correo}"></td>
                            <td class="px-6 py-4 text-gray-700" th:text="${p.direccion}"></td>
                            <td class="px-6 py-4 text-green-700 font-medium" th:text="${p.rol}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(personal)}">
                            <td colspan="8" class="px-6 py-10 text-center text-gray-500">No hay personal registrado en este momento.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/script.js}" defer></script>
</body>
</html>
